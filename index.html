<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>Flake Family Audiobooks</title><style>
:root{--bg:#f6f1ea;--card:#fffdf9;--ink:#2b2420;--soft:#6b5d52;--line:#e4d9cc;--apple:#8e3fd6;--pc:#f43e37}
@media (prefers-color-scheme:dark){:root{--bg:#1d1916;--card:#28221e;--ink:#f3ece4;--soft:#b9aa9c;--line:#3d342d}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.5 Georgia,'Times New Roman',serif}
main{max-width:560px;margin:0 auto;padding:28px 16px 48px}
h1{font-size:1.9rem;line-height:1.2;margin:18px 0 2px}.by{color:var(--soft);margin:0 0 16px;font-style:italic}
.cover{display:block;width:100%;max-width:340px;margin:0 auto;border-radius:6px;box-shadow:0 6px 24px rgba(0,0,0,.25)}
p{margin:0 0 14px}.small{font-size:.9rem;color:var(--soft)}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:16px;margin:12px 0;border-radius:12px;
 color:#fff;text-decoration:none;font:600 1.1rem/1.2 -apple-system,system-ui,'Segoe UI',sans-serif}
.apple{background:var(--apple)}.pc{background:var(--pc)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin:20px 0}
h2{font-size:1.15rem;margin:0 0 8px}ol{margin:0;padding-left:1.4em}li{margin:3px 0}li span{color:var(--soft);font-size:.9rem}
details{margin-top:10px}summary{cursor:pointer;color:var(--soft);font-size:.95rem}
input{width:100%;font:14px monospace;padding:8px;margin-top:6px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink)}
a.book{display:flex;gap:14px;align-items:center;color:inherit;text-decoration:none}a.book img{width:90px;border-radius:4px}
</style></head>
<body><main><h1>Flake Family Audiobooks</h1><p class='by'>Family stories, read aloud</p><div class="card"><a class="book" href="my-life-story/"><img src="my-life-story/cover.jpg" alt="">
<div><b>My Life Story</b><br><span class="small">by Dennis Edson Flake</span></div></a></div></main></body></html>
